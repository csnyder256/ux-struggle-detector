name: Guided demo Pages
on:
  pull_request:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'docs/**', 'scripts/build-demo-pages.mjs', 'package.json', 'pnpm-lock.yaml', 'VERSION', '.github/workflows/demo-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm sdk:build:min && pnpm sdk:build && pnpm demo:build
      - run: node scripts/build-demo-pages.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
