name: Release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/verify_release.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: POSTGRES_PASSWORD=build AUTH_SECRET=build KEY_ENCRYPTION_KEY=build docker compose -p release-build -f compose.yml build app setup
      - run: python scripts/smoke_release.py
      - run: npm install -g pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm test
      - run: pnpm sdk:build
      - run: pnpm sdk:build:min
      - run: pnpm sdk:package
      - run: pnpm demo:build
      - run: pnpm sdk:verify
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm demo:verify
      - run: git diff --exit-code -- public/sdk.js public/sdk.min.js public/demo/demo.js
      - run: python scripts/package_release.py
      - run: python scripts/verify_bundle.py
      - uses: actions/upload-artifact@v7
        with:
          name: release-downloads
          path: dist-release/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-downloads
          path: dist-release/
      - uses: softprops/action-gh-release@v3
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: dist-release/*
          fail_on_unmatched_files: true
