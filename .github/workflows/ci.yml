name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build SDK bundles
        run: |
          pnpm sdk:build
          pnpm sdk:build:min

      - name: Fail if the checked-in SDK bundles are stale
        run: git diff --exit-code -- public/sdk.js public/sdk.min.js

      # Typecheck and unit tests do not load every module the way the
      # production bundle does. A dependency that breaks at bundle time
      # (ESM-only majors, removed exports) only shows up here. The values are
      # placeholders: the build connects to nothing.
      - name: Production build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          AUTH_SECRET: build-only-placeholder
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm build
